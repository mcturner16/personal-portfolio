  <h1>My First Chart</h1>

  <!-- ============ CHART (worked example) ============ -->
  <figure>
    <div id="chart1" class="chart"></div>
    <figcaption class="writeup">
      This first chart takes a <a href="https://www.kaggle.com/datasets/sibamsamanta07/movies-dataset-45k-films-with-budget-and-revenue">Movies Dataset</a> from the Kaggle User SibamSamanta07 which contains metadata about 45,466 Movies. This chart looks at the median revenue in USD for each genre of Movies.
    </figcaption>
  </figure>

  <figure>
    <div id="chart2" class="chart"></div>
    <figcaption class="writeup">
      This second chart looks at the average revenue for each genre instead of the median. You can see how the rankings and the x-axis shifts.
      <p>For example, the median revenue for a Horror Movie in this dataset is $25,519,166, ranking 11th out of 20 Genres. Whereas the average revenue for a Horror Movie is more than double the median, at $53,896,875. However, this ranks only 16th out of the 20 Genres. Meanwhile the X-Axis roughly doubles in range compared to the first graph, but looks visually similar to the naked eye.</p>
    </figcaption>
  </figure>

  <figure>
    <div id="chart3" class="chart"></div>
    <figcaption class="writeup">
      For the third chart, I decided to go back to the median but instead find the median "profit", defined as revenue minus budget.
      <p>You can see that Animation movies go from 6th in median and average revenue to 1st in median profit. Family movies go from 4th in median revenue and 5th in average revenue to 2nd in median profit. This is because of far lower budgets on average and median than the genres ranked above them in revenue - Adventure, Fantasy, Action and Science Fiction. Interestingly, Foreign and Western Movies dipped into negative median profit.</p>
    </figcaption>
  </figure>

  <figure>
    <div id="chart4" class="chart"></div>
    <figcaption class="writeup">
      For the fourth chart, I naturally decided to look at the average profit.
      <p>The Adventure Genre reclaimed its spot as having the highest average profit, with Fantasy 2nd. Family and Animation dropped to 3rd and 4th, respectively. This is likely due to major blockbuster movies creating a sort of boom or bust dynamic. With the major hits dragging the average up, but the median staying lower due to less successful movies. The Adventure Genre's median profit is $54,269,486 and the average profit is $127,826,344.</p>
    </figcaption>
  </figure>
